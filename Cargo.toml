[package]
name = "runboard"
default-run = "runboard"
version = "0.1.0"
edition = "2021"
description = "Read-only run metrics, queue history and device telemetry from files, served as HTML"
license = "MIT"
repository = "https://github.com/matterstate/runboard"
readme = "README.md"

[dependencies]
async-nats = { version = "0.50", default-features = false, features = [
  "jetstream",
  "ring",
  "server_2_10",
] }
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
futures-util = "0.3"
getrandom = "0.4"
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

[profile.release]
debug = 1
